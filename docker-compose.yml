version: "3.9"

services:
  # ==========================================
  # 1. PostgreSQL + PostGIS (Spatial Database)
  # ==========================================
  postgres:
    image: postgis/postgis:15-3.3
    container_name: birdeye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-postgis.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Directus (Headless CMS + RBAC + API)
  # ==========================================
  directus:
    image: directus/directus:latest
    container_name: birdeye-cms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      WEBSOCKETS_ENABLED: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

  # ==========================================
  # 3. FastAPI AI Microservice
  # ==========================================
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: birdeye-ai
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_SERVICE_TOKEN: ${DIRECTUS_SERVICE_TOKEN}
    volumes:
      - ./apps/ai-service:/app

  # ==========================================
  # 4. Next.js Frontend (Dev Mode)
  # ==========================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: birdeye-web
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055
      NEXT_PUBLIC_STADIA_MAPS_API_KEY: ${NEXT_PUBLIC_STADIA_MAPS_API_KEY}
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:${AI_SERVICE_PORT:-8000}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
